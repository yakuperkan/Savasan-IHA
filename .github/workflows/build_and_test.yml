name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev

      - name: Configure (tests-only mode)
        run: cmake -S 02_Ana_Sistem_CPP -B 02_Ana_Sistem_CPP/build-ci -DSAVASAN_BUILD_APP=OFF -DSAVASAN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build 02_Ana_Sistem_CPP/build-ci -j

      - name: Run unit tests
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ctest --test-dir 02_Ana_Sistem_CPP/build-ci --output-on-failure \
            -L unit \
            | tee ci-logs/unit-tests.log

      - name: Upload unit test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: ci-logs/unit-tests.log
          if-no-files-found: warn

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev

      - name: Configure (tests-only mode)
        run: cmake -S 02_Ana_Sistem_CPP -B 02_Ana_Sistem_CPP/build-ci -DSAVASAN_BUILD_APP=OFF -DSAVASAN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build 02_Ana_Sistem_CPP/build-ci -j

      - name: Run integration tests
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ctest --test-dir 02_Ana_Sistem_CPP/build-ci --output-on-failure \
            -L integration \
            | tee ci-logs/integration-tests.log

      - name: Upload integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: ci-logs/integration-tests.log
          if-no-files-found: warn

  jetson-phase5-smoke:
    if: ${{ vars.ENABLE_JETSON_SMOKE == '1' }}
    runs-on:
      - self-hosted
      - linux
      - arm64
      - jetson
    needs: integration-tests
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture runner info
        run: |
          mkdir -p ci-logs
          uname -a | tee ci-logs/jetson-runner-info.log
          (command -v jetson_release >/dev/null 2>&1 && jetson_release -v) | tee -a ci-logs/jetson-runner-info.log || true
          (command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi) | tee -a ci-logs/jetson-runner-info.log || true

      - name: Configure (app + tests)
        run: cmake -S 02_Ana_Sistem_CPP -B 02_Ana_Sistem_CPP/build-smoke -DSAVASAN_BUILD_APP=ON -DSAVASAN_BUILD_TESTS=ON

      - name: Build smoke binary
        run: cmake --build 02_Ana_Sistem_CPP/build-smoke --target savasan_iha -j2

      - name: Run phase5 runtime smoke
        env:
          SAVASAN_SMOKE_CAMERA: ${{ vars.SAVASAN_SMOKE_CAMERA || 'csi' }}
          SAVASAN_SMOKE_RUN_SECONDS: ${{ vars.SAVASAN_SMOKE_RUN_SECONDS || '12' }}
          SAVASAN_SMOKE_LOCK_MODE: ${{ vars.SAVASAN_SMOKE_LOCK_MODE || 'hybrid' }}
          SAVASAN_V4L2_DEVICE: ${{ vars.SAVASAN_V4L2_DEVICE || '/dev/video0' }}
        run: |
          mkdir -p ci-logs
          set -o pipefail
          timeout 180s 02_Ana_Sistem_CPP/scripts/ci_phase5_smoke.sh \
            | tee ci-logs/jetson-phase5-smoke-wrapper.log

      - name: Upload Jetson smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jetson-phase5-smoke-logs
          path: |
            ci-logs/jetson-*.log
            ci-logs/phase5-smoke.log
          if-no-files-found: warn
